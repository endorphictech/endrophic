<noscript><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --teal:#16897A; --green:#5AC85A;
    --teal-btn:#147A6D; --green-btn:#2E7D32;
    --paper:#FAF9F6; --paper-2:#F4F1EA; --card:#FFFFFF;
    --ink:#16181D; --grey:#68666F; --grey-light:#625F6A;
    --border:#E7E3DA; --shadow:0 20px 44px -22px rgba(22,24,29,0.14);
    --maxw:1180px; --radius:18px;
    --grad: linear-gradient(90deg,var(--teal),var(--green));
    --grad-btn: linear-gradient(90deg,var(--teal-btn),var(--green-btn));
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;font-family:'Poppins',sans-serif;background:var(--paper);color:var(--grey);font-weight:300;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  img,svg{display:block;max-width:100%;}
  img{width:100%;height:100%;object-fit:cover;}
  a{color:inherit;text-decoration:none;}
  ul{margin:0;padding:0;list-style:none;}
  section{padding:110px 24px;}
  .wrap{max-width:var(--maxw);margin:0 auto;}
  h1,h2,h3{font-family:'Poppins',sans-serif;font-weight:700;margin:0;color:var(--ink);letter-spacing:-0.01em;line-height:1.15;}
  p{margin:0;font-weight:300;}
  .grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--grey);margin-bottom:18px;}
  .eyebrow::before{content:"";width:16px;height:2px;border-radius:2px;background:var(--grad);}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:16px 30px;border-radius:999px;font-weight:600;font-size:14.5px;cursor:pointer;border:none;transition:transform .25s ease,box-shadow .25s ease,filter .25s ease;white-space:nowrap;}
  .btn-primary{background:var(--grad-btn);color:#fff;position:relative;box-shadow:0 10px 24px -10px rgba(22,137,122,.45);}
  .btn-primary:hover{filter:brightness(1.08);transform:translateY(-2px);}
  .btn-primary::after{content:"";position:absolute;inset:0;border-radius:999px;box-shadow:0 0 0 0 rgba(90,200,90,.5);animation:pulse-ring 2.8s cubic-bezier(.4,0,.6,1) infinite;pointer-events:none;}
  .btn-primary span.shine{position:absolute;inset:0;border-radius:999px;overflow:hidden;pointer-events:none;}
  .btn-primary span.shine::before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .7s ease;}
  .btn-primary:hover span.shine::before{left:130%;}
  @keyframes pulse-ring{0%{box-shadow:0 0 0 0 rgba(90,200,90,.5);}70%{box-shadow:0 0 0 14px rgba(90,200,90,0);}100%{box-shadow:0 0 0 0 rgba(90,200,90,0);}}
  .btn-nav{padding:10px 20px;font-size:12.5px;box-shadow:0 6px 16px -8px rgba(22,137,122,.5);}
  
  .floating-cta{
    position:fixed;bottom:22px;right:22px;z-index:70;
    width:58px;height:58px;padding:0;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--grad-btn);box-shadow:0 14px 30px -10px rgba(22,137,122,.55);
  }
  .floating-cta:hover{filter:brightness(1.08);transform:translateY(-2px);}
  .floating-cta svg{width:29px;height:29px;fill:#fff;}
  .floating-cta::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 0 rgba(90,200,90,.5);animation:pulse-ring 2.8s cubic-bezier(.4,0,.6,1) infinite;pointer-events:none;}
  
  .btn-outline{background:transparent;border:1.5px solid rgba(255,255,255,.4);color:#fff;}
  .btn-outline:hover{border-color:#fff;transform:translateY(-2px);}
  .btn-outline-dark{background:transparent;border:1.5px solid var(--border);color:var(--ink);}
  .btn-outline-dark:hover{border-color:var(--ink);transform:translateY(-2px);}

  /* ===== FLOATING PILL NAV ===== */
  header{position:sticky;top:16px;z-index:60;padding:0 20px;}
  nav.wrap{
    background:#fff;border-radius:999px;box-shadow:0 12px 32px -14px rgba(22,24,29,.16);
    padding:10px 10px 10px 22px;display:flex;align-items:center;justify-content:space-between;
    max-width:var(--maxw);border:1px solid var(--border);
  }
  .logo{display:flex;align-items:center;gap:8px;}
  .logo img{height:53px;width:auto;}
  .nav-links{display:flex;align-items:center;gap:26px;}
  .nav-links a{font-size:13.5px;font-weight:500;color:var(--grey);transition:color .25s ease;}
  .nav-scorecard-badge{background:var(--grad-btn);color:#fff !important;padding:8px 16px;border-radius:999px;font-weight:700 !important;transition:transform .2s ease,filter .2s ease !important;}
  .nav-scorecard-badge:hover{filter:brightness(1.08);transform:translateY(-1px);}
  .nav-links a:hover{color:var(--ink);}
  .menu-toggle{display:none;background:none;border:none;cursor:pointer;padding:8px;}
  .menu-toggle span{display:block;width:20px;height:2px;background:var(--ink);margin:5px 0;border-radius:2px;}

  /* ===== HERO CAROUSEL ===== */
  .hero{position:relative;min-height:100vh;overflow:hidden;padding:0;margin-top:-92px;}
  .hero-slides{position:absolute;inset:0;}
  .hero-slide{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease;}
  .hero-slide.active{opacity:1;}
  .hero-glow{
    position:absolute;inset:0;z-index:1;
    background:
      linear-gradient(180deg, rgba(8,10,9,.3), rgba(6,8,7,.72)),
      radial-gradient(circle at 12% 18%, rgba(90,200,90,.4), transparent 55%),
      radial-gradient(circle at 88% 82%, rgba(22,137,122,.38), transparent 55%);
  }
  .hero-content{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:150px 24px 70px;}
  .hero-content .wrap{max-width:760px;}
  .hero-text-stack{transition:opacity .5s ease;}
  .hero-text-stack.fading{opacity:0;}
  .hero-in{opacity:0;transform:translateY(18px);animation:hero-up .8s ease forwards;}
  .hero-in.d1{animation-delay:.15s;} .hero-in.d2{animation-delay:.32s;} .hero-in.d3{animation-delay:.5s;} .hero-in.d4{animation-delay:.68s;}
  @keyframes hero-up{to{opacity:1;transform:translateY(0);}}
  .hero .eyebrow{color:#DFF5E4;}
  .hero .eyebrow::before{background:var(--grad);}
  .hero h1{font-size:clamp(34px,5.6vw,64px);font-weight:700;margin-bottom:22px;color:#fff;}
  .hero h1 .accent{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .hero .subhead{font-size:17px;font-weight:300;color:rgba(255,255,255,.82);max-width:580px;margin-bottom:32px;}
  .hero-cta{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
  .hero-dots{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);z-index:3;display:flex;gap:10px;}
  .hero-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);cursor:pointer;border:none;padding:0;transition:all .35s ease;}
  .hero-dot.active{width:26px;border-radius:6px;background:var(--grad);}

  /* ===== MARQUEE ===== */
  .marquee-section{padding:44px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--card);overflow:hidden;}
  .marquee-label{text-align:center;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--grey-light);margin-bottom:26px;}
  .marquee-track{display:flex;width:max-content;animation:scroll-left 28s linear infinite;}
  .marquee-track span{font-size:18px;font-weight:600;color:var(--grey);white-space:nowrap;padding:0 30px;display:flex;align-items:center;gap:30px;}
  .marquee-track span::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--grad);}
  @keyframes scroll-left{from{transform:translateX(0);}to{transform:translateX(-50%);}}

  .section-head{max-width:640px;margin-bottom:52px;}
  .section-head h2{font-size:clamp(26px,3.4vw,40px);font-weight:700;}
  .section-head p{color:var(--grey);font-size:15.5px;font-weight:300;margin-top:14px;}
  .section-head.center{margin-left:auto;margin-right:auto;text-align:center;}

  /* ===== CLIENT LOGO MARQUEE ===== */
  .logos-section{padding:40px 0;background:var(--paper-2);border-bottom:1px solid var(--border);overflow:hidden;}
  .logos-label{text-align:center;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--grey-light);margin-bottom:26px;}
  .logos-track{display:flex;width:max-content;animation:scroll-left 32s linear infinite;align-items:center;}
  .logo-chip{
    display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);
    border-radius:12px;padding:12px 22px;margin:0 12px;white-space:nowrap;
  }
  .logo-chip .mark{width:26px;height:26px;border-radius:8px;background:var(--grad);flex-shrink:0;}
  .logo-chip span{font-size:14px;font-weight:600;color:var(--grey);}

  /* ===== BACKDROP LINE ART ===== */
  section{position:relative;}
  .line-art{position:absolute;pointer-events:none;opacity:0.06;z-index:0;}
  .line-art svg{width:100%;height:100%;display:block;}
  .problem .wrap, .founder .wrap{position:relative;z-index:1;}

  /* ===== THE PROBLEM ===== */
  .problem{background:var(--card);border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
  .problem .wrap{max-width:920px;text-align:center;}
  .problem h2{font-size:clamp(25px,3.6vw,38px);margin-bottom:18px;}
  .problem .lead{font-size:16.5px;color:var(--grey);max-width:640px;margin:0 auto 50px;}
  .ecosystem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:760px;margin:0 auto;}
  .ecosystem-item{
    background:var(--paper-2);border:1px solid var(--border);border-radius:16px;padding:20px 14px;
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  .ecosystem-icon{width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;}
  .ecosystem-icon svg{width:20px;height:20px;stroke:var(--grey);}
  .ecosystem-item .platform{font-size:13.5px;font-weight:700;color:var(--ink);}
  .ecosystem-item .caption{font-size:11.5px;color:var(--grey-light);line-height:1.4;}
  .ecosystem-arrows{display:grid;grid-template-columns:repeat(4,1fr);max-width:760px;margin:14px auto;}
  .ecosystem-arrows svg{width:16px;height:16px;stroke:var(--border);margin:0 auto;}
  .ecosystem-hub{
    max-width:520px;margin:0 auto;background:var(--grad-btn);border-radius:18px;padding:22px 28px;
    display:flex;align-items:center;gap:16px;justify-content:center;box-shadow:0 16px 34px -14px rgba(22,137,122,.45);
  }
  .ecosystem-hub .ecosystem-icon{background:rgba(255,255,255,.18);border-color:transparent;}
  .ecosystem-hub .ecosystem-icon svg{stroke:#fff;}
  .ecosystem-hub .platform{color:#fff;font-size:16px;font-weight:800;}
  .ecosystem-hub .caption{color:rgba(255,255,255,.85);font-size:12.5px;text-align:left;}
  .ecosystem-hub .text-block{display:flex;flex-direction:column;gap:2px;align-items:flex-start;}

  /* ===== SERVICES ===== */
  .services{background:var(--paper);}
  .service-row{display:grid;grid-template-columns:170px 1fr 1.5fr;gap:24px;padding:30px 0;border-top:1px solid var(--border);align-items:start;}
  .service-row:last-child{border-bottom:1px solid var(--border);}
  .service-cat{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--teal-btn);font-weight:600;padding-top:6px;}
  .service-main h3{font-size:20px;margin-bottom:8px;font-weight:700;}
  .service-main p{font-size:14px;font-weight:300;color:var(--grey);}
  .service-tags{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;}
  .service-tags span{font-size:12.5px;font-weight:400;color:var(--grey);border:1px solid var(--border);padding:7px 14px;border-radius:999px;transition:border-color .3s ease,color .3s ease,background .3s ease;}
  .service-tags span:hover{border-color:var(--teal);color:var(--ink);background:var(--paper-2);}

  /* ===== PROOF CARDS ===== */
  .proof{background:var(--card);border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
  .proof-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
  .proof-card{background:var(--paper);border:1px solid var(--border);border-radius:20px;padding:28px;transition:transform .3s ease,box-shadow .3s ease;}
  .proof-card:hover{transform:translateY(-5px);box-shadow:var(--shadow);}
  .proof-eyebrow{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--teal-btn);margin-bottom:12px;}
  .proof-card h3{font-size:19px;font-weight:700;margin-bottom:8px;}
  .proof-card p.desc{font-size:14px;font-weight:300;color:var(--grey);margin-bottom:24px;}
  .proof-mock{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;}

  /* Reviews mock */
  .mock-rating{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;}
  .mock-rating .num{font-size:26px;font-weight:800;color:var(--ink);}
  .mock-stars{color:#F5B400;font-size:13px;letter-spacing:1px;}
  .mock-rating .delta{margin-left:auto;font-size:12px;font-weight:600;color:var(--teal-btn);}
  .mock-review{background:var(--paper-2);border-radius:10px;padding:12px;font-size:12.5px;color:var(--ink);}
  .mock-review .meta{display:block;margin-top:6px;font-size:11px;color:var(--grey-light);font-weight:400;}

  /* Website mock */
  .mock-browser-bar{display:flex;align-items:center;gap:6px;margin-bottom:12px;}
  .mock-browser-bar .dot{width:8px;height:8px;border-radius:50%;}
  .mock-browser-bar .dot:nth-child(1){background:#FF5F57;}
  .mock-browser-bar .dot:nth-child(2){background:#FEBC2E;}
  .mock-browser-bar .dot:nth-child(3){background:#28C840;}
  .mock-browser-bar .url{margin-left:8px;font-size:11px;color:var(--grey-light);background:var(--paper-2);padding:4px 10px;border-radius:6px;flex:1;}
  .mock-clinic-name{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px;}
  .mock-clinic-hours{font-size:11.5px;color:var(--grey-light);margin-bottom:12px;}
  .mock-book-btn{display:inline-block;background:var(--grad-btn);color:#fff;font-size:12px;font-weight:600;padding:8px 16px;border-radius:8px;}

  /* Recalls mock */
  .mock-chat-bubble{background:var(--paper-2);border-radius:12px 12px 12px 4px;padding:10px 14px;font-size:12.5px;color:var(--ink);margin-bottom:8px;max-width:92%;}
  .mock-chat-meta{font-size:10.5px;color:var(--grey-light);margin-bottom:12px;}
  .mock-chat-reply{background:var(--grad-btn);color:#fff;border-radius:12px 12px 4px 12px;padding:8px 14px;font-size:12.5px;font-weight:600;display:block;width:fit-content;margin-left:auto;margin-bottom:8px;}
  .mock-chat-status{font-size:11px;color:var(--teal-btn);font-weight:600;}

  /* ===== INTERACTIVE MODEL / TABS ===== */
  .model{background:var(--paper);}
  .model .wrap{max-width:1100px;}
  .model-head{margin-bottom:36px;}
  .diagnostic-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;}
  .diagnostic-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px 18px;text-align:center;}
  .diagnostic-icon{width:46px;height:46px;border-radius:13px;background:var(--paper-2);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
  .diagnostic-icon svg{width:21px;height:21px;stroke:var(--teal-btn);}
  .diagnostic-card h4{font-size:15.5px;font-weight:700;margin-bottom:6px;color:var(--ink);}
  .diagnostic-card p{font-size:12.5px;color:var(--grey);line-height:1.5;}
  .methodology-lead{text-align:center;font-size:14px;color:var(--grey-light);margin:36px 0 30px;font-style:italic;}

  .model-head h2{font-size:clamp(28px,4vw,44px);font-weight:700;}
  .model-body{display:grid;grid-template-columns:1fr 1.3fr;gap:32px;align-items:start;}
  .tab-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .tab-btn{
    display:flex;flex-direction:column;justify-content:center;
  }

  /* ===== MOBILE RESPONSIVE FIXES ===== */
  @media (max-width:720px){
    .ecosystem-grid{grid-template-columns:repeat(2,1fr);}
    .ecosystem-arrows{display:none;}
    .ecosystem-hub{margin-top:18px;flex-direction:column;text-align:center;}
    .ecosystem-hub .text-block{align-items:center;}
    .ecosystem-hub .caption{text-align:center;}
    .diagnostic-grid{grid-template-columns:repeat(2,1fr);}
    .proof-grid{grid-template-columns:1fr;}
    .service-row{grid-template-columns:1fr;}
    
    /* WHATSAPP FLOATING BUTTON MOBILE FIX */
    .floating-cta {
      position: fixed;
      bottom: 24px !important;
      right: 24px !important;
      left: auto !important;
      width: 52px !important;
      height: 52px !important;
      z-index: 9999;
    }
    .floating-cta svg {
      width: 26px !important;
      height: 26px !important;
    }
  }
</style>
</head>
